<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a07">
<meta name="description" content="稷山板枣数字馆三维展项：三维沙盘演示枣粮间作的春夏秋冬，点位配申报书图片和 2026 年项目实拍。">
<title>枣园四季沙盘 · 稷山板枣数字馆</title>
<style>
@font-face{font-family:'JSSerif';src:url('assets/font/title.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--gold:#ffd98a;--ink:#2a1206;--serif:'JSSerif',"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","SimSun",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0a07;color:#fff;font-family:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","SimSun",serif;-webkit-user-select:none;user-select:none;touch-action:none}
#bg{position:fixed;inset:0;background:#1a120a url(assets/zx/bg-siji.jpg) center/cover;filter:brightness(.42) saturate(.75);transform:scale(1.1);transition:filter 1.2s}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 25%,rgba(0,0,0,.8) 100%)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.head{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 18px) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));pointer-events:none}
.tag{display:inline-block;vertical-align:top;font-size:12px;letter-spacing:.2em;padding:4px 10px;border:1px solid rgba(255,217,138,.6);color:var(--gold);background:rgba(0,0,0,.3)}
.zback{pointer-events:auto;position:relative;display:inline-flex;align-items:center;vertical-align:top;margin-right:8px;font-size:12px;letter-spacing:.12em;padding:4px 10px 4px 5px;border:1px solid rgba(255,217,138,.6);border-radius:14px;color:#fff3d6;background:rgba(0,0,0,.45);text-decoration:none}
.zback svg{width:14px;height:14px;flex:none}
.zback::after{content:"";position:absolute;inset:-10px -6px}
.zback:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.head h1{margin-top:10px;font-family:var(--serif);font-size:26px;letter-spacing:.12em;text-shadow:0 2px 10px #000}
.head p{font-size:12px;margin-top:4px;letter-spacing:.08em;opacity:.85;text-shadow:0 1px 4px #000}
#month{position:fixed;right:max(18px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 60px);text-align:right;pointer-events:none}
#month b{display:block;font-family:var(--serif);font-size:40px;line-height:1;color:var(--gold);text-shadow:0 0 16px rgba(255,200,110,.6)}
#month span{font-size:12px;letter-spacing:.2em;opacity:.8}
/* 沙盘上的点位 */
.pin{position:fixed;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:opacity .3s;background:none;border:0;padding:0;font:inherit;color:inherit}
.pin span{white-space:nowrap;font-size:12px;letter-spacing:.06em;padding:4px 9px;border-radius:12px;background:rgba(20,10,4,.78);border:1px solid rgba(255,217,138,.75);color:#ffe9bd}
.pin i{width:2px;height:16px;background:linear-gradient(var(--gold),transparent)}
.pin em{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(255,217,138,.7);animation:ping 1.8s infinite}
.pin:focus-visible span{outline:2px solid #fff3d6;outline-offset:2px}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,217,138,.7)}100%{box-shadow:0 0 0 14px rgba(255,217,138,0)}}
@media (prefers-reduced-motion:reduce){.pin em{animation:none}}
.pin.hide{opacity:0;pointer-events:none}
/* 底部四季面板 */
#sheet{position:fixed;left:0;right:0;bottom:0;padding:14px max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 14px) max(18px,env(safe-area-inset-left));background:linear-gradient(to bottom,rgba(18,10,4,0),rgba(18,10,4,.9) 16%,rgba(14,8,3,.97))}
#sheet>*{max-width:640px;margin-left:auto;margin-right:auto}
.seasons{display:flex;gap:8px}
.seasons button{flex:1;height:40px;border-radius:20px;font-family:inherit;font-size:17px;letter-spacing:.2em;border:1px solid rgba(255,217,138,.45);background:rgba(0,0,0,.35);color:#f3e3c4;transition:all .3s;cursor:pointer}
.seasons button.on{border-color:transparent;color:var(--ink);background:linear-gradient(180deg,#ffe3a6,#e6b45f);font-weight:700;box-shadow:0 0 16px rgba(255,200,110,.4)}
.seasons button:focus-visible,#play:focus-visible{outline:2px solid #fff3d6;outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;margin-top:12px;margin-bottom:4px}
#play{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid rgba(255,217,138,.6);background:rgba(0,0,0,.35);color:var(--gold);font-size:14px;cursor:pointer}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(90deg,#9fb8d6 0%,#8fc46a 25%,#e7c24e 50%,#c0412b 75%,#9fb8d6 100%);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff3d6;border:3px solid var(--gold);box-shadow:0 0 10px var(--gold)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff3d6;border:3px solid var(--gold)}
input[type=range]:focus-visible{outline:2px solid #fff3d6;outline-offset:6px}
.months{display:flex;justify-content:space-between;font-size:10px;opacity:.5;padding:0 2px 0 48px}
.stitle{margin-top:10px;font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.1em}
.desc{margin-top:6px;font-size:13.5px;line-height:1.75;color:rgba(255,245,230,.86);min-height:72px}
.src{font-size:11px;color:rgba(255,226,166,.55);margin-top:2px;letter-spacing:.1em}
/* 点位详情卡 */
#card{position:fixed;inset:0;z-index:30;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;padding:24px;background:rgba(8,5,2,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
#card.on{opacity:1;pointer-events:auto}
.cbox{width:min(88vw,380px);border-radius:14px;overflow:hidden;background:#1d130b;border:1px solid rgba(255,217,138,.5);box-shadow:0 0 40px rgba(255,200,110,.25),0 20px 50px rgba(0,0,0,.6);transform:translateY(30px) scale(.94);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
#card.on .cbox{transform:none}
.cbox img{width:100%;height:auto;max-height:44vh;object-fit:cover;display:block;background:#2a1d12}
.cbody{padding:16px 18px 18px}
.cbody h3{font-family:var(--serif);font-size:20px;letter-spacing:.12em;color:var(--gold)}
.cbody p{margin-top:8px;font-size:14px;line-height:1.8;color:#f3e6cf}
.cbody small{display:block;margin-top:10px;font-size:11px;opacity:.55;letter-spacing:.08em}
.cbody small+small{margin-top:2px}
.cclose{margin-top:14px;width:100%;height:42px;border-radius:21px;border:1px solid rgba(255,217,138,.55);background:transparent;color:var(--gold);font-family:inherit;font-size:15px;letter-spacing:.15em;cursor:pointer}
.cclose:focus-visible{outline:2px solid #fff3d6;outline-offset:2px}
.drag{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 132px);transform:translateX(-50%);font-size:12px;opacity:.55;letter-spacing:.1em;pointer-events:none;transition:opacity 1s;white-space:nowrap}
.nogl{position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:6px;padding:24px;text-align:center;background:#0d0a07;color:#f3e3c4;font-size:15px;line-height:1.8}
</style>
</head>

<div id="bg"></div><canvas id="c"></canvas>
<div class="head"><a class="zback" href="./#hall3" aria-label="返回第三展厅"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>返回</a><span class="tag">第三展厅 · 农业景观</span><h1>枣园四季</h1><p>枣粮间作 · 林—田—村—水</p></div>
<div id="month"><b id="mNum">四月</b><span id="mSea">春季</span></div>
<div class="drag" id="drag">← 拖动旋转沙盘 · 点击金色点位看实景 →</div>
<div id="pins"></div>
<div id="sheet"><div class="seasons" id="seasons"><button data-m="3.6">春</button><button data-m="5.4">夏</button><button data-m="8.6">秋</button><button data-m="0.6">冬</button></div><div class="bar"><button id="play" aria-label="暂停">❚❚</button><input type="range" id="slider" min="0" max="11.99" step="0.01" value="3.6" aria-label="月份"></div><div class="months" aria-hidden="true"><span>1月</span><span>4月</span><span>7月</span><span>10月</span><span>12月</span></div><div class="stitle" id="stitle"></div><div class="desc" id="desc"></div><div class="src" id="src"></div></div>
<div id="card" role="dialog" aria-modal="true" aria-labelledby="ct"><div class="cbox"><img id="cimg" alt=""><div class="cbody"><h3 id="ct"></h3><p id="cp"></p><small id="cs"></small><small id="cph"></small><button class="cclose" id="cclose">返回沙盘</button></div></div></div>
<script src="zx.js?v=20261119-6"></script>
</body>
</html>
